events {
    worker_connections 1024;
}

http {
    upstream spring_backend {
        server backend:8080;
    }

    map $http_origin $cors_origin {
        default "";
        "~^https://(www\.)?yourdomain\.com$" "$http_origin";
        "~^http://localhost(:[0-9]+)?$" "$http_origin";
        "~^http://127\.0\.0\.1(:[0-9]+)?$" "$http_origin";
        "~^http://192\.168\.1\.[0-9]+(:[0-9]+)?$" "$http_origin";
        "~^http://10\.0\.2\.2(:[0-9]+)?$" "$http_origin";
    }

    # Rate Limiting with http_x_forwarded_for to read the real IP
    limit_req_zone $http_x_forwarded_for zone=api_limit:10m rate=10r/s;

    server {
        listen 80;

        location /api/ {
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            proxy_hide_header 'Access-Control-Allow-Headers';
            proxy_hide_header 'Access-Control-Allow-Credentials';

            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # Rate Limiting: 10 requests/sec with extra 20
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://spring_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 90;
            proxy_send_timeout 90;
            proxy_read_timeout 90;
        }
    }
}